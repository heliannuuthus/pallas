apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pallas
  labels:
    app.kubernetes.io/name: pallas
    app.kubernetes.io/part-of: heliantheon
spec:
  ingressClassName: traefik
  rules:
    - host: aegis.heliannuuthus.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pallas
                port:
                  name: http
